[package]
name = "rusti2"
version = "0.1.0"
edition = "2021"
description = "gRPC object storage service wrapping Cloudflare R2"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.13"
tonic-health = "0.13"
cotab-proto = { git = "https://github.com/brojyf/cotab-proto", tag = "v0.2.0" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = "0.32"
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
bytes = "1"
http-body-util = { version = "0.1", features = ["channel"] }
proptest = "1.6"

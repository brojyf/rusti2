[package]
name = "rusti2"
version = "0.1.0"
edition = "2021"
description = "gRPC object storage service wrapping Cloudflare R2"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tonic = "0.13"
tonic-health = "0.13"
prost = "0.13"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
tower = "0.5"

[build-dependencies]
tonic-build = "0.13"
